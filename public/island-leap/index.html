<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:url" content="https://game.catholic.mt/island-leap/">
<meta property="og:image" content="https://game.catholic.mt/island-leap/og-image.png">
<meta name="google-adsense-account" content="ca-pub-8822751120164826">
<title>Paul's Island Leap 3D</title>
<meta name="description" content="A pseudo-3D isometric island jumping game featuring St. Paul.">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
<a class="back-home" href="/" aria-label="Back to game home">← HOME</a>
<canvas id="game"></canvas>
<div class="hud">
  <div>SCORE <span id="score">0</span><br>BEST&nbsp;&nbsp;<span id="best">0</span></div>
  <div class="title">PAUL'S ISLAND LEAP<small>ISOMETRIC MEDITERRANEAN</small></div>
</div>
<div class="overlay" id="overlay">
  <div class="card">
    <h1 id="ot">PAUL'S ISLAND LEAP</h1>
    <p id="op">Press Space or tap once to start. Then hold Space or press and hold the screen to charge; release to leap.</p>
    <p><kbd>SPACE</kbd></p>
  </div>
</div>
<div class="hint" id="hint">HOLD SPACE / SCREEN TO CHARGE • RELEASE TO JUMP</div>
<button class="mute" id="muteBtn" type="button" aria-label="Toggle sound effects" aria-pressed="false">SOUND: ON</button>
</div>
<script src="./game.js"></script>
</body>
</html>

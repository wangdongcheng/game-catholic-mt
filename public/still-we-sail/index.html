<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta property="og:url" content="https://game.catholic.mt/still-we-sail/">
  <meta property="og:image" content="https://game.catholic.mt/still-we-sail/og-image.png">
  <meta name="google-adsense-account" content="ca-pub-8822751120164826">
  <title>Still We Sail — Acts 27</title>
  <meta name="description" content="A small pixel-art browser game inspired by St. Paul's voyage in Acts 27." />
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="wrap">
    <section class="game-shell" id="gameShell" aria-label="Still We Sail game">
      <canvas id="game" width="960" height="540"></canvas>
      <a class="back-home" href="/" aria-label="Back to game home">← HOME</a>

      <div class="hud">
        <div class="score">
          SCORE <span id="score">000000</span><br>
          BEST&nbsp;&nbsp;<span id="best">000000</span>
        </div>
        <div class="title">
          STILL WE SAIL
          <small>— ACTS 27 —</small>
        </div>
      </div>

      <div class="overlay" id="overlay">
        <div class="card">
          <h1 id="overlayTitle">STILL WE SAIL</h1>
          <p class="subtitle" id="overlayText">
            Guide St. Paul's little ship through storms, sea creatures and the dangerous waters of Melita.
          </p>
          <div class="keys">
            <kbd>SPACE</kbd>
            <kbd>↑</kbd>
            <kbd>CLICK / TAP</kbd>
          </div>
          <p class="subtitle" style="margin:18px 0 0">Jump to begin</p>
        </div>
      </div>

      <div class="note">Melita ahead →</div>
      <button class="mute" id="muteBtn" type="button">SOUND: ON</button>
    </section>
    <div class="rotate-hint">↻ ROTATE FOR A LARGER VIEW</div>
  </main>

  <script type="module" src="./game.js"></script>
</body>

</html>
